# ============================================================
# AI数字人财经直播平台 V4.0 — Jetson Docker Compose
# ============================================================
# 用法: docker compose -f docker/jetson/docker-compose.yml up -d
# 前提: Jetson Xavier NX 已安装 NVIDIA Container Runtime
#       sudo apt-get install -y nvidia-container-runtime

version: "3.8"

services:
  ai-live-jetson:
    build:
      context: ../..
      dockerfile: docker/jetson/Dockerfile
    image: ai-live-jetson:4.0.0
    container_name: ai-live-jetson
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      - STOCKSTREAM_PLATFORM=jetson
      - STOCKSTREAM_JETSON_MODE=1
      - NVIDIA_VISIBLE_DEVICES=all
      - OPENBLAS_CORETYPE=ARMV8
      - OMP_NUM_THREADS=4
    volumes:
      - ../../data:/opt/stockstream/data
      - ../../logs:/opt/stockstream/logs
      - ../../models:/opt/stockstream/models:ro
      - ../../configs:/opt/stockstream/configs:ro
      - /usr/src/jetson_multimedia_api:/usr/src/jetson_multimedia_api:ro
    runtime: nvidia
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 2G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, compute, utility]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 60s
      timeout: 15s
      retries: 5
      start_period: 120s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    sysctls:
      - net.core.somaxconn=1024
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
