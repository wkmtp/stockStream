# StockStream v2.0 — AI双数字人财经直播平台
# 环境变量优先级最高: STOCKSTREAM_MARKET__POLL_SECONDS=10

# ── 系统 ──
host: "0.0.0.0"
port: 8080
workers: 1
log_level: "info"
jetson_mode: false

# ── 日志 ──
log:
  level: "INFO"
  dir: "logs"
  rotation: "midnight"
  retention_days: 90
  max_bytes: 52428800
  enable_console: true
  enable_file: true

# ── 数据库 ──
database:
  url: "sqlite+aiosqlite:///data/stockstream.db"
  pool_size: 5
  pool_pre_ping: true
  auto_migrate: true

# ── 行情采集 ──
market:
  poll_seconds: 5
  sqlite_path: "data/market_cache.db"
  symbols:
    - "600519"
    - "000001"
    - "300750"
    - "000858"
    - "002594"
    - "601318"
    - "600036"
    - "000002"
    - "600276"
    - "601012"

# ── TTS 语音合成 (双音色: 男声超文 + 女声华燕) ──
tts:
  voice: "zh_CN-huayan-medium"
  model_path: "models/zh_CN-huayan-medium.onnx"
  voice_male: "zh_CN-chaowen-medium"
  model_path_male: "models/zh_CN-chaowen-medium.onnx"
  voice_female: "zh_CN-huayan-medium"
  model_path_female: "models/zh_CN-huayan-medium.onnx"
  sample_rate: 22050
  length_scale: 1.0
  noise_scale: 0.667
  noise_w: 0.8
  sentence_silence: 0.2
  # 男声参数
  male_length_scale: 1.05
  male_noise_scale: 0.65
  male_noise_w: 0.78
  # 女声参数
  female_length_scale: 0.92
  female_noise_scale: 0.72
  female_noise_w: 0.72

# ── 双主播系统 ──
dual_host:
  enable_debate: true
  enable_humor: true
  enable_storytelling: true
  enable_audience: true
  enable_news: true
  enable_avatar: true
  dialogue_turns_per_stock: [3, 6]
  inter_speaker_pause: 0.5
  tts_output_dir: "data/dual_host_audio"
  segment_duration: 120

# ── 推流 ──
stream:
  rtmp_url: ""
  queue_size: 1024
  video_codec: "libx264"
  fps: 25
  width: 1920
  height: 1080

# ── AI 分析 (DeepSeek API) ──
analysis:
  deepseek_api_key: ""
  deepseek_model: "deepseek-chat"
  deepseek_timeout: 30.0

# ── 交易 ──
trader:
  capital: 3000.0
  portfolio_path: "data/portfolio.json"
  tick_seconds: 10.0
  auto_open: true
  auto_add: true
  auto_reduce: false
  auto_clear: true

# ── 数字人 ──
avatar:
  enabled: false
  host_image: "data/host.png"
  host_image_female: "data/host_female.png"
  face_detector_onnx: "models/face_detector.onnx"
  wav2lip_onnx: "models/wav2lip_gan.onnx"
  fps: 25
  face_batch_size: 128
  output_dir: "data/avatar"
  auto_generate: true

# ── 直播运营 ──
live:
  port: 8080
  title: "AI财经双数字人直播间"
  douyin:
    cookie: ""
    room_id: ""
    rtmp_url: ""
  kuaishou:
    cookie: ""
    room_id: ""

# ── 图表系统 ──
chart:
  cache_dir: "cache/charts"
  refresh_seconds: 5
  default_width: 880
  default_height: 700
  dpi: 100

# ── 热力图 ──
heatmap:
  cache_dir: "cache/heatmap"
  refresh_seconds: 10

# ── 字幕 ──
subtitle:
  cache_dir: "cache/subtitle"
  font_size: 32
  width: 1920
  height: 80
  highlight_color: "#ffdd00"

# ── 仪表盘 ──
dashboard:
  cache_dir: "cache/dashboard"

# ── 幻灯片 ──
slide:
  cache_dir: "cache/slides"

# ── 短视频切片 ──
clip:
  output_dir: "data/clips"
  durations: [30, 60, 90]
  auto_generate: true

# ── Agents ──
agents:
  chief_director:
    segment_duration: 120
    market_analysis_interval: 180        # 每3分钟股票分析
    sector_interval: 600                 # 每10分钟热点板块
    news_interval: 900                   # 每15分钟新闻点评
    fun_fact_interval: 1200              # 每20分钟财经趣闻
    audience_qa_interval: 1800           # 每30分钟互动问答
    silence_threshold: 30               # 冷场阈值(秒)
    traffic_interval_minutes: 15
    monetization_interval_minutes: 30

# ── 恢复管理器 ──
recovery:
  max_retries: 5
  base_delay: 1.0
  max_delay: 60.0
  stream_max_reconnect: 20

# ── 调度 ──
scheduler:
  timezone: "Asia/Shanghai"
  market_open_check_seconds: 60

# ── 内容调度 ──
content:
  cycle_duration: 3600
  segment_min: 30
  segment_max: 120
  dedup_window: 1800

# ── 资源调度 (Jetson优化) ──
resource:
  check_interval: 2.0

# ── 监控 ──
monitoring:
  metrics_port: 9090
  health_check_interval: 30
  log_retention_days: 7
  cpu_threshold: 80
  memory_threshold_mb: 5500    # Jetson: 5.5GB 告警
  gpu_threshold_pct: 80        # Jetson: GPU 80% 告警
  disk_threshold_pct: 85

# ── Jetson Xavier NX 优化 ──
jetson:
  memory_limit_mb: 5800        # 总内存限制 < 6GB
  gpu_limit_pct: 80            # GPU 占用 < 80%
  tensorrt_fp16: true          # TensorRT FP16 推理
  onnx_threads: 4              # ONNX 推理线程数
  max_queue_size: 512          # 队列上限
  batch_size: 4                # 批处理大小
