# ============================================================
# AI数字人财经直播平台 V4.0 — Release: production-jetson
# ============================================================
# 用途:     边缘端 7x24 无人值守直播推流
# 硬件:     NVIDIA Jetson Xavier NX 8GB
# JetPack:  5.x | CUDA: 11.4 | TensorRT: 8.x
# Python:   3.8.10
# 内存限制: <6GB (进程)
# 继承链:   base → jetson → production → environment/production/jetson → 本文件
# ============================================================

extends: [jetson, production, environment/production/jetson]

release:
  name: "production-jetson"
  target: "production"
  description: "Jetson 生产版本 - TensorRT FP16 + 边缘推理 + 30天连续运行"

platform: jetson
mode: production

server:
  host: "0.0.0.0"
  port: "${STREAM_PORT:-8080}"
  workers: 1
  reload: false
  debug: false

gpu:
  enabled: true
  onnx_providers: ["TensorrtExecutionProvider", "CUDAExecutionProvider"]
  fp16: true
  tensorrt_fp16: true
  tensorrt_cache_path: "/data/tensorrt_cache"
  memory_limit_mb: 5800
  benchmark: false

market:
  provider: "akshare"
  real_data: true
  mock_fallback: true          # 网络波动时降级
  cache_ttl_seconds: 600
  update_interval: 10
  retry_max: 5
  retry_backoff: 3.0

interaction:
  real_danmu: true
  mock_enabled: false
  danmaku_enabled: true
  max_danmaku_per_frame: 5

avatar:
  enabled: true
  multi_avatar: false           # 单头像节省内存
  large_model: false
  fps: 15
  resolution: [384, 384]
  face_detector_interval: 3

tts:
  engine: "piper"
  fp16: true
  sample_rate: 16000

monitor:
  enabled: true
  dashboard: true
  metrics_port: 9090
  sample_interval: 15
  alerts:
    enabled: true
    notify_on_critical: true
    notify_on_warning: true

security:
  api_token_enabled: true
  auth_required: true
  encrypt_config: true
  log_sanitize: true
  rate_limit: true
  rate_limit_per_minute: 30
  token_expire_hours: 12

scheduler:
  enabled: true
  timezone: "Asia/Shanghai"
  auto_start: true
  auto_stop: true
  pre_market_minutes: 30

logging:
  level: "WARNING"
  console: false
  file: true
  json_format: true
  rotation: "midnight"
  max_bytes: 52428800          # 50MB 磁盘限制
  backup_count: 3

# Jetson 可靠性专属
reliability:
  watchdog:
    enabled: true
    hardware: true             # Jetson 硬件看门狗
    auto_restart: true
    max_restarts_per_day: 5
  health_check_interval: 30
  stream_reconnect_attempts: 10
  circuit_breaker:
    enabled: true
    api_failure_threshold: 5
    api_recovery_timeout: 60
  graceful_shutdown_timeout: 30
  7x24_mode: true
  daily_restart_time: "04:00"
  max_uptime_days: 30
  resource_check_interval: 60

storage:
  database_url: "sqlite:///data/stockstream.db"
  backup_interval_hours: 6
  backup_retention_days: 14
  cleanup_enabled: true
  min_free_disk_gb: 5          # 自动清理保持 5GB 空闲
