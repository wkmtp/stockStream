# ============================================================
# StockStream V4.0 — Grafana Dashboard Provisioning
# ============================================================

apiVersion: 1

providers:
  - name: "StockStream"
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: true
