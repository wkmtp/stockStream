# StockStream V3.0 — Docker 开发模式 Compose
# 使用: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# 开发特性:
#   - 挂载源码实现热重载 (include src/, stockstream/)
#   - Uvicorn --reload 自动重启
#   - 5678 端口 debugpy 远程调试
#   - 日志级别 debug
#   - 无需 GPU

services:
  stockstream:
    build:
      target: dev
    image: stockstream:dev

    environment:
      STOCKSTREAM_ENV: "development"
      STOCKSTREAM_LOG_LEVEL: "debug"
      STOCKSTREAM_JETSON_MODE: "0"

    volumes:
      # 挂载源码 (修改后自动热重载)
      - ./src:/app/src
      - ./stockstream:/app/stockstream
      - ./config:/app/config:ro
      # 持久化运行时数据
      - stockstream-data:/app/data
      - stockstream-logs:/app/logs
      - stockstream-cache:/app/cache
      - stockstream-backups:/app/backups

    ports:
      - "8080:8080"    # API + 直播页
      - "5678:5678"    # debugpy

    command:
      - python
      - "-m"
      - "debugpy"
      - "--listen"
      - "0.0.0.0:5678"
      - "-m"
      - "uvicorn"
      - "src.web:create_app_factory"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--reload"

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 60s
      timeout: 15s
      retries: 5
      start_period: 120s
